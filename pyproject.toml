[project]
name = "docuchat-rag"
version = "0.1.0"
description = "Multi-format document RAG chatbot with source citations — powered by LangChain, ChromaDB, HuggingFace BGE, and Groq Llama 3."
requires-python = ">=3.12"
dependencies = [
    "streamlit==1.60.0",
    "langchain==1.3.14",
    "langchain-community==0.4.2",
    "langchain-core==1.5.2",
    "langchain-huggingface==1.2.2",
    "langchain-chroma==1.1.0",
    "langchain-groq==1.1.3",
    "langchain-text-splitters==1.1.2",
    "chromadb==1.5.9",
    "groq==0.37.1",
    "sentence-transformers==5.6.1",
    "pypdf==6.14.2",
    "docx2txt==0.9",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "torch==2.13.0",
    "transformers==5.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
